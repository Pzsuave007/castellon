<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Castellon · Logo Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#faf7ec;font-family:'IBM Plex Sans',sans-serif;color:#1F3A2E;padding:48px}
  h1{font-family:'Teko',sans-serif;font-size:48px;letter-spacing:3px;margin:0 0 8px;text-transform:uppercase}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:4px;color:#5c6a5c;margin-bottom:40px;text-transform:uppercase}
  h2{font-family:'Teko',sans-serif;font-size:28px;letter-spacing:2px;margin:48px 0 16px;text-transform:uppercase;border-left:4px solid #4A90C2;padding-left:12px}
  .row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .card{background:#fff;border:2px solid #b8a87e;padding:32px;box-shadow:8px 8px 0 #1F3A2E;display:flex;align-items:center;justify-content:center;min-height:200px}
  .dark{background:#1F3A2E;border-color:#1F3A2E;box-shadow:8px 8px 0 #4A90C2}
  .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#5c6a5c;margin-top:8px;text-transform:uppercase;text-align:center}
  .col{display:flex;flex-direction:column;align-items:center}
  img{display:block;max-width:100%;height:auto}
</style>
</head>
<body>
  <h1>Castellon · Logo System</h1>
  <div class="sub">— BUILT IN HAND-CODED SVG · CRISP AT ANY SIZE —</div>

  <h2>01 / Main Shield Badge</h2>
  <div class="row">
    <div class="col"><div class="card"><img src="/logos/castellon-badge.svg" width="300"/></div><div class="label">ON CREAM</div></div>
    <div class="col"><div class="card dark"><img src="/logos/castellon-badge.svg" width="300"/></div><div class="label">ON FOREST</div></div>
  </div>

  <h2>02 / Horizontal Wordmark — for site header</h2>
  <div class="row">
    <div class="col"><div class="card"><img src="/logos/castellon-wordmark.svg" width="460"/></div><div class="label">ON CREAM</div></div>
  </div>
  <div class="row" style="margin-top:24px">
    <div class="col"><div class="card dark"><img src="/logos/castellon-wordmark.svg" width="460"/></div><div class="label">ON FOREST</div></div>
  </div>

  <h2>03 / Square Mark — favicon · social · app icon</h2>
  <div class="row">
    <div class="col"><div class="card"><img src="/logos/castellon-mark.svg" width="160"/></div><div class="label">160 PX</div></div>
    <div class="col"><div class="card"><img src="/logos/castellon-mark.svg" width="96"/></div><div class="label">96 PX</div></div>
    <div class="col"><div class="card"><img src="/logos/castellon-mark.svg" width="48"/></div><div class="label">48 PX</div></div>
    <div class="col"><div class="card"><img src="/logos/castellon-mark.svg" width="32"/></div><div class="label">32 PX</div></div>
    <div class="col"><div class="card"><img src="/logos/castellon-mark.svg" width="16"/></div><div class="label">16 PX FAVICON</div></div>
  </div>
</body>
</html>
