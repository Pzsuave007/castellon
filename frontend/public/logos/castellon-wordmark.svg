<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" role="img" aria-label="Castellon Septic Services">
  <defs>
    <style>
      .display { font-family: 'Teko', 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 700; text-transform: uppercase; }
      .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Icon square -->
  <rect x="4" y="10" width="90" height="90" rx="6" fill="#1F3A2E"/>

  <!-- Truck inside icon -->
  <g transform="translate(14 38)">
    <rect x="0" y="28" width="74" height="5" fill="#F6EFD9"/>
    <rect x="2" y="6" width="48" height="22" rx="11" fill="#6BC95C" stroke="#F6EFD9" stroke-width="2"/>
    <rect x="2" y="6" width="6" height="22" fill="#F6EFD9" rx="3"/>
    <text x="26" y="22" text-anchor="middle" fill="#1F3A2E" class="display" font-size="9" letter-spacing="0.5">1800 GAL</text>
    <path d="M52 11 L65 11 L70 18 L70 28 L52 28 Z" fill="#4A90C2" stroke="#F6EFD9" stroke-width="2" stroke-linejoin="round"/>
    <path d="M55 14 L64 14 L67 20 L55 20 Z" fill="#F6EFD9"/>
    <circle cx="14" cy="38" r="5.5" fill="#F6EFD9"/>
    <circle cx="14" cy="38" r="2" fill="#1F3A2E"/>
    <circle cx="60" cy="38" r="5.5" fill="#F6EFD9"/>
    <circle cx="60" cy="38" r="2" fill="#1F3A2E"/>
    <rect x="22" y="2" width="3" height="5" fill="#F6EFD9"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="54" fill="#1F3A2E" class="display" font-size="38" letter-spacing="2">CASTELLON</text>

  <!-- Divider line -->
  <rect x="110" y="62" width="180" height="2" fill="#4A90C2"/>

  <!-- Secondary line -->
  <text x="108" y="86" fill="#1F3A2E" class="display" font-size="20" letter-spacing="3">SEPTIC SERVICES</text>

  <!-- Tiny est. tag -->
  <text x="296" y="86" fill="#6BC95C" class="mono" font-size="10">· SPOKANE WA</text>
</svg>
