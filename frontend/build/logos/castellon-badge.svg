<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Castellon Septic Services">
  <defs>
    <style>
      .display { font-family: 'Teko', 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 700; text-transform: uppercase; }
      .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Outer shield -->
  <path d="M180 12 L335 50 L335 220 Q335 320 180 408 Q25 320 25 220 L25 50 Z"
        fill="#F6EFD9" stroke="#1F3A2E" stroke-width="10" stroke-linejoin="round"/>
  <!-- Inner border -->
  <path d="M180 32 L320 67 L320 218 Q320 305 180 385 Q40 305 40 218 L40 67 Z"
        fill="none" stroke="#1F3A2E" stroke-width="2.5"/>

  <!-- Top dark band -->
  <path d="M40 67 L320 67 L320 130 L40 130 Z" fill="#1F3A2E"/>
  <!-- accent line -->
  <line x1="40" y1="134" x2="320" y2="134" stroke="#4A90C2" stroke-width="3"/>

  <!-- CASTELLON wordmark (sized to fit band) -->
  <text x="180" y="111" text-anchor="middle" fill="#F6EFD9" class="display" font-size="40" letter-spacing="2.5">CASTELLON</text>

  <!-- Pine tree decorations on left and right of band -->
  <g fill="#6BC95C" stroke="#1F3A2E" stroke-width="1.5" stroke-linejoin="round">
    <g transform="translate(60 100)">
      <polygon points="0,-12 -6,-2 -3,-2 -7,5 -2,5 -8,12 8,12 2,5 7,5 3,-2 6,-2"/>
    </g>
    <g transform="translate(300 100)">
      <polygon points="0,-12 -6,-2 -3,-2 -7,5 -2,5 -8,12 8,12 2,5 7,5 3,-2 6,-2"/>
    </g>
  </g>

  <!-- Truck silhouette -->
  <g transform="translate(70 160)">
    <!-- chassis -->
    <rect x="0" y="76" width="220" height="9" fill="#1F3A2E"/>
    <!-- tank (lime green cylinder) -->
    <rect x="6" y="20" width="148" height="58" rx="29" fill="#6BC95C" stroke="#1F3A2E" stroke-width="4"/>
    <!-- left tank end-cap dark band -->
    <rect x="6" y="20" width="14" height="58" fill="#1F3A2E" rx="7"/>
    <!-- tank seam -->
    <line x1="80" y1="20" x2="80" y2="78" stroke="#1F3A2E" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- 1800 GAL stamp -->
    <text x="105" y="55" text-anchor="middle" fill="#1F3A2E" class="display" font-size="18" letter-spacing="1">1800 GAL</text>
    <!-- top pipe -->
    <rect x="60" y="10" width="8" height="14" fill="#1F3A2E"/>
    <circle cx="64" cy="9" r="5" fill="#1F3A2E"/>
    <!-- cab (blue) -->
    <path d="M158 32 L200 32 L210 50 L210 78 L158 78 Z" fill="#4A90C2" stroke="#1F3A2E" stroke-width="4" stroke-linejoin="round"/>
    <!-- windshield -->
    <path d="M167 39 L196 39 L202 52 L167 52 Z" fill="#F6EFD9" stroke="#1F3A2E" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- door line -->
    <line x1="178" y1="52" x2="178" y2="78" stroke="#1F3A2E" stroke-width="2"/>
    <!-- wheels -->
    <circle cx="40" cy="92" r="12" fill="#1F3A2E"/>
    <circle cx="40" cy="92" r="4.5" fill="#F6EFD9"/>
    <circle cx="75" cy="92" r="12" fill="#1F3A2E"/>
    <circle cx="75" cy="92" r="4.5" fill="#F6EFD9"/>
    <circle cx="185" cy="92" r="12" fill="#1F3A2E"/>
    <circle cx="185" cy="92" r="4.5" fill="#F6EFD9"/>
  </g>

  <!-- Decorative divider line below truck -->
  <line x1="80" y1="285" x2="280" y2="285" stroke="#1F3A2E" stroke-width="2"/>
  <polygon points="180,279 184,285 180,291 176,285" fill="#4A90C2"/>

  <!-- SEPTIC SERVICES -->
  <text x="180" y="320" text-anchor="middle" fill="#1F3A2E" class="display" font-size="28" letter-spacing="4">SEPTIC SERVICES</text>

  <!-- Star -->
  <polygon points="180,338 182,344 188,344 183,348 185,354 180,350 175,354 177,348 172,344 178,344" fill="#4A90C2"/>

  <!-- EST line -->
  <text x="180" y="372" text-anchor="middle" fill="#1F3A2E" class="mono" font-size="11">EST. SPOKANE · WA</text>
</svg>
